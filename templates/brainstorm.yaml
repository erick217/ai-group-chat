# 头脑风暴：适合"找联想、找选题、找映射"这类发散型议题。
# 先盲写（互相看不到，避免被第一个想法带偏），再互评、投票、深化，最后由编辑产出博文大纲。
name: 头脑风暴
icon: 💡
description: 适合发散型议题。「盲写 → 互评 → 投票 → 深化 → 出大纲」，最后由编辑产出博文方案。
placeholder: 输入素材或典故，以及你想找什么样的映射或选题…
summarizer: 编辑
examples:
  - 1988 年，安徽电视台拍了电视剧《华佗》。对这部电视剧我只记得一个镜头：华佗把自己毕生心血投入火盆，他说："与其让曹孟德来烧，不如我自己烧。"当下有什么事情映射这个场景？
  - 「刻舟求剑」在今天的职场和投资里有哪些新版本？
guide: |
  这是一场头脑风暴，先发散，再收敛。用户给出一段素材（典故、意象、故事），大家寻找它在当下的映射，
  最终目标是选出一个能写成好博文的选题，并产出大纲。
  映射要具体：指向具体的事件、群体或现象，并说清楚它和素材在结构上"像"在哪里，而不只是表面相似。

agents:
  - name: 时评人
    avatar: 🗞
    color: "#2563eb"
    bio: 时事评论员，熟悉近期新闻
    use: deepseek-pro
    temperature: 0.9
    persona: |
      你是一位敏锐的时事评论员，熟悉近一两年的社会、经济和国际新闻，
      擅长把历史典故和当下事件对照，一针见血。

  - name: 历史学者
    avatar: 📜
    color: "#b45309"
    bio: 挖掘典故背后的深层结构
    use: glm
    temperature: 0.8
    persona: |
      你熟悉中国历史和典故的来龙去脉。你关注典故背后的深层结构（权力关系、处境、选择），
      反对牵强附会，会指出一个映射是神似还是只是形似。

  - name: 科技观察者
    avatar: 💻
    color: "#059669"
    bio: 关注互联网、AI 与开源
    use: deepseek-flash
    temperature: 0.9
    persona: |
      你长期关注互联网平台、人工智能、开源社区和数字内容生态，
      熟悉创作者、程序员、研究者在技术和平台规则变化中的处境。

  - name: 文艺评论者
    avatar: 🎭
    color: "#db2777"
    bio: 关注文学影视和创作者处境
    use: mimo-flash
    temperature: 1.0
    persona: |
      你是文艺评论者，关注文学、影视、音乐和艺术圈，对创作者的处境和作品的命运格外敏感，
      善于捕捉情绪和隐喻。

  - name: 编辑
    avatar: ✍️
    color: "#6b7280"
    bio: 专栏编辑，判断能否写成好文章
    use: deepseek-pro
    max_tokens: 5000
    in_free_chat: false
    persona: |
      你是资深专栏编辑，判断什么选题能写成好文章：有共鸣、有张力、有具体细节、不牵强。
      你说话干脆，重结构，重可写性。

phases:
  - name: 盲写
    goal: 独立提出 3 个当下的映射。每个先用一句话说明是什么事件或现象，再用一两句话说明它和素材在结构上"像"在哪里。尽量提出别人想不到的。
    speakers: all
    blind: true
    search: true
    max_chars: 350

  - name: 互评
    goal: 看完所有人的提案，挑出你认为最贴切和最牵强的各一个（可以是别人的），说明理由；也可以把两个提案合并成更好的。
    speakers: all
    max_chars: 250

  - name: 投票
    goal: 投票选出最适合写成博文的 1 个映射（不能投自己的），用一句话说明理由。最后一行固定写：投票：<提案人>的「<映射简称>」
    speakers: all
    summarize: true
    summary_task: 统计投票结果，宣布得票最高的映射（平票时由你裁定），用两三句话说明它为什么值得写。
    max_chars: 150

  - name: 深化
    goal: 围绕胜出的映射深入讨论：它和素材的相似之处有多深？关键的不同在哪里（不同之处往往是文章的亮点）？补充具体的事实、细节和例子。
    speakers: all
    turns: 4
    search: true
    max_chars: 250

  - name: 出大纲
    goal: |
      产出博文方案：
      1. 3 个备选标题
      2. 一句话核心观点
      3. 分节大纲：每节写要点和可用的事实素材，注明出处
      4. 示范开头段落
      5. 写作时要避开的牵强之处
    speakers: [编辑]
    max_chars: 1500
